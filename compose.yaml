services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      PARTY2_DB_DSN: party2:party2@tcp(mariadb:3306)/party2?parseTime=true
      PARTY2_TEST_DB_ADMIN_DSN: root:root@tcp(mariadb:3306)/?parseTime=true
      PARTY2_VALKEY_ADDR: valkey:6379
      PARTY2_MAX_PLAYERS: "999"
      GOFLAGS: ${GOFLAGS:-}
      TEST_TIMEOUT: ${TEST_TIMEOUT:-}
      PARTY2_TEST_TIMEOUT: ${PARTY2_TEST_TIMEOUT:-}
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/workspace
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
    command: ["sh", "-c", "timeout_arg=\"-timeout=30m\"; case \" $${GOFLAGS:-} \" in *' -timeout='*|*' -test.timeout='*) timeout_arg=\"\" ;; esac; if [ -n \"$${TEST_TIMEOUT:-}\" ]; then timeout_arg=\"-timeout=$${TEST_TIMEOUT}\"; elif [ -n \"$${PARTY2_TEST_TIMEOUT:-}\" ]; then timeout_arg=\"-timeout=$${PARTY2_TEST_TIMEOUT}\"; fi; exec go test $${timeout_arg} \"$@\"", "--", "./..."]

  mariadb:
    image: mariadb:latest
    environment:
      MARIADB_DATABASE: party2
      MARIADB_USER: party2
      MARIADB_PASSWORD: party2
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro

  valkey:
    image: valkey/valkey:alpine
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  go-build-cache:
  go-mod-cache:
  mariadb-data:
  valkey-data:
