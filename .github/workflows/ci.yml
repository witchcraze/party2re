name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and run tests
        run: docker compose run --rm app sh -c 'go test ./... -coverprofile=coverage.out -covermode=atomic && go tool cover -func=coverage.out > coverage.txt && cat coverage.txt'
      - name: Validate content catalogs
        run: docker compose run --rm app go test ./internal/core/job ./internal/core/item
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: error
      - name: Check formatting
        run: test -z "$(docker compose run --rm app find . -name '*.go' -exec gofmt -l {} +)"
      - name: Run static analysis
        run: docker compose run --rm app go vet ./...
