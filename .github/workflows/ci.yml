name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4

      - name: Check formatting
        run: |
          docker compose run --rm app sh -c \
            'unformatted=$(gofmt -l $(find . -name "*.go" -not -path "./vendor/*")); \
             if [ -n "$unformatted" ]; then echo "Unformatted files:"; echo "$unformatted"; exit 1; fi'

      - name: Run static analysis
        run: docker compose run --rm app go vet ./...

      - name: Build and run tests with coverage
        run: |
          docker compose run --name party2re_ci_app --rm=false app sh -c \
            'go test ./... -coverprofile=/tmp/coverage.out -covermode=atomic \
             && go tool cover -func=/tmp/coverage.out > /tmp/coverage.txt \
             && cat /tmp/coverage.txt'
          docker cp party2re_ci_app:/tmp/coverage.out coverage.out || true
          docker cp party2re_ci_app:/tmp/coverage.txt coverage.txt || true
          docker rm party2re_ci_app 2>/dev/null || true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: warn

      - name: Build production image (smoke test)
        run: docker build -f Dockerfile -t party2re:ci-smoke .
