# Disposable services for make check, make check-changed and CI.
# A separate project on separate ports keeps tests away from the development
# volumes in compose.yaml; data lives on tmpfs and vanishes when containers stop.
name: party2re-test

services:
  mariadb:
    image: mariadb:latest
    command: ["--max-connections=500"]
    environment:
      MARIADB_DATABASE: party2
      MARIADB_USER: party2
      MARIADB_PASSWORD: party2
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${PARTY2_TEST_DB_PORT:-3307}:3306"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/mysql:size=4g

  valkey:
    image: valkey/valkey:alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${PARTY2_TEST_VALKEY_PORT:-6380}:6379"
    tmpfs:
      - /data
